<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelMate AI · Adaptive Multi-Agent Tourism Companion</title>

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Tailwind CSS (via CDN with custom palette) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Outfit"', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#f0f7ff',
                100: '#e0effe',
                200: '#bae0fd',
                300: '#7cc6fb',
                400: '#38a8f7',
                500: '#0e8ee9',
                600: '#0270c7',
                700: '#0359a1',
                800: '#074c85',
                900: '#0c406e',
                950: '#082949',
              },
              luxury: {
                gold: '#d97706',
                emerald: '#059669',
                rose: '#e11d48',
                indigo: '#4f46e5',
                purple: '#7c3aed',
                slate: '#0f172a'
              }
            },
            boxShadow: {
              'card': '0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(0, 0, 0, 0.03)',
              'card-hover': '0 20px 40px -15px rgba(2, 112, 199, 0.12), 0 0 0 1px rgba(2, 112, 199, 0.15)',
              'glow-brand': '0 0 35px -5px rgba(2, 112, 199, 0.35)',
              'glow-emerald': '0 0 35px -5px rgba(5, 150, 105, 0.35)',
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        overflow-x: hidden;
      }
      h1, h2, h3, .font-heading {
        font-family: 'Outfit', sans-serif;
      }
      .leaflet-container {
        width: 100%;
        height: 100%;
        border-radius: 1.25rem;
      }
      /* Custom Glassmorphism */
      .glass-panel {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .glass-panel-dark {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      /* Custom Thin Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
      @keyframes pulseSlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .animate-pulse-slow {
        animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>
  <body class="bg-slate-50 antialiased selection:bg-brand-600 selection:text-white">
    <!-- Ambient Radial Light Glows -->
    <div class="fixed top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-b from-blue-100/40 via-sky-50/20 to-transparent pointer-events-none -z-10 blur-3xl"></div>
    <div class="fixed top-1/3 -left-32 w-96 h-96 bg-indigo-100/30 rounded-full pointer-events-none -z-10 blur-3xl"></div>
    <div class="fixed bottom-1/4 -right-32 w-96 h-96 bg-emerald-100/25 rounded-full pointer-events-none -z-10 blur-3xl"></div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
